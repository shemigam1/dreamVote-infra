# Tests, then builds and pushes container images to GHCR on push to main.
#
#   1. `changes`        - detect whether server/ui actually changed
#   2. `test-server`    - run Spring Boot tests against a Mongo service (gates server image build)
#   3. `build-server`   - build & push to ghcr.io/.../dreamvote-server (depends on test-server)
#   4. `build-ui`       - build & push to ghcr.io/.../dreamvote-ui (parallel; no tests yet)
#
# Image tags per push:
#   :sha-<short>  -- immutable; pin this from your prod overlay
#   :latest       -- mutable; convenient for local "docker pull", NEVER from a prod manifest
#
# Triggers:
#   - push to main (full pipeline)
#   - pull_request (tests run; image push job has its own permissions check
#     and won't push from forked PRs because the GITHUB_TOKEN is read-only there)
#   - workflow_dispatch (manual run from the Actions tab)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: shemigam1

jobs:
  # ----- Detect what changed --------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - '.github/workflows/ci.yml'

  # ----- Run Spring Boot tests -----------------------------------------------
  # Boots the full Spring context (@SpringBootTest), which means it needs a
  # real Mongo. GitHub Actions `services:` block runs one in a sidecar
  # container exposed on localhost:27017 - exactly what application.properties'
  # default URI expects, no env var needed.
  test-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # The runner waits for `--health-cmd` to succeed before starting the
        # job's steps, so we don't need to add a manual wait-loop.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          # Caches ~/.m2 across runs keyed on pom.xml hash. First run downloads
          # everything (slow); subsequent runs reuse - typically 30s vs 3min.
          cache: maven

      - name: Run tests
        working-directory: server
        run: ./mvnw -B -e -ntp verify

  # ----- Server image ---------------------------------------------------------
  build-server:
    # Wait for tests AND the changes job. The `if:` is on `changes.outputs`
    # because GHA evaluates `needs:` results before evaluating `if`.
    needs: [changes, test-server]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/dreamvote-server
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          # Skip pushing on pull_request events - GITHUB_TOKEN is read-only
          # for forks, and even for branch PRs it's good hygiene to only
          # publish from main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  # ----- UI image -------------------------------------------------------------
  build-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/dreamvote-ui
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
