# Server block for the SPA + API proxy. Included by the base image's main
# nginx.conf via:
#     include /etc/nginx/conf.d/*.conf;
#
# We replace the stock default.conf with this file.

server {
    # Port 8080 because nginx-unprivileged can't bind <1024 (no root).
    # Compose / K8s maps this to whatever external port we choose.
    listen 8080;
    server_name _;

    # Where the built SPA lives - matches the COPY target in the Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck endpoint. Cheap (no file IO, no upstream hop) and
    # independent of the SPA bundle being valid. Used by:
    #   - Dockerfile HEALTHCHECK
    #   - compose depends_on: condition: service_healthy (later)
    #   - K8s readiness probe (later)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- API proxy --------------------------------------------------------
    # Reverse-proxies /api/* to the Spring Boot service.
    #
    # The TRAILING SLASH on proxy_pass is load-bearing:
    #   - WITH slash: nginx strips the matched location prefix (/api/) and
    #     replaces it with the proxy_pass path (/). So a request to
    #     /api/voters/login is forwarded to http://server:8080/voters/login.
    #   - WITHOUT slash: nginx forwards the URI verbatim, so the backend
    #     would receive /api/voters/login and 404 (no /api prefix in
    #     controllers).
    #
    # The hostname "server" resolves to the API container via the compose
    # network. In Kubernetes this becomes the Service name "server" - the
    # same DNS pattern works in both, which is why we use compose service
    # names that match what we'll use in K8s manifests.
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;

        # Forward the original Host so the backend sees what the browser sent.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static assets ----------------------------------------------------
    # Vite outputs hashed filenames under /assets/ (e.g. index-D3aB2c.js),
    # so the URL itself is the cache key. Safe to cache aggressively.
    # `immutable` tells the browser it never needs to revalidate.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback -----------------------------------------------------
    # Any request that doesn't match a real file falls through to index.html,
    # letting React Router handle the path on the client. Without this,
    # deep-linking to e.g. /elections/123 would 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
