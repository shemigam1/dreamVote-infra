# Secret skeleton for the server. Currently empty because:
#   - The custom auth implementation has no JWT secret to plumb in
#   - The dev Mongo runs without authentication
#
# When you do add secrets (JWT signing key, Mongo username/password,
# third-party API keys, etc.) the pattern is:
#
#   data:
#     JWT_SECRET: <base64-encoded value>
#     MONGO_USERNAME: <base64-encoded value>
#     MONGO_PASSWORD: <base64-encoded value>
#
# Then reference from server-deployment.yaml the same way the ConfigMap is
# referenced (envFrom: secretRef:).
#
# IMPORTANT: never commit real secrets to git. For Minikube/learning, plain
# Secret resources are fine (they're just base64-encoded, not encrypted).
# For EKS, use AWS Secrets Manager + the External Secrets Operator, or
# AWS-managed encryption with a KMS key on the cluster.
#
# This file is committed only as a placeholder/template. Empty Secrets are
# valid - they just don't expose any keys.
apiVersion: v1
kind: Secret
metadata:
  name: server-secret
  namespace: dreamvote
type: Opaque
data: {}
